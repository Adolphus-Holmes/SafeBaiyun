name: Build optimized debug-signed Android APK

on:
  push:
    branches:
      - fix/edit-dialog-ime-copy
      - feat/multi-config-bluetooth-import-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          validate-wrappers: false

      - name: Build optimized Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK signature and report size
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          SIZE="$(wc -c < "$APK" | tr -d ' ')"
          HUMAN_SIZE="$(du -h "$APK" | cut -f1)"
          echo "Debug-signed optimized APK size: $SIZE bytes ($HUMAN_SIZE)"
          {
            echo "### APK build"
            echo "- Variant: Debug (debug keystore signed)"
            echo "- Minification: R8 enabled"
            echo "- Resource shrinking: enabled"
            echo "- Version: 1.2 (versionCode 3)"
            echo "- APK size: $SIZE bytes ($HUMAN_SIZE)"
            echo "- Certificate: SHA-256 digest printed in the verification log above"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeBaiyun-debug-signed-optimized-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
