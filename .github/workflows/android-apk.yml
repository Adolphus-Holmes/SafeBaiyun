name: Build and publish Android APK

on:
  push:
    branches:
      - fix/edit-dialog-ime-copy
      - feat/multi-config-bluetooth-import-export
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          validate-wrappers: false

      - name: Prepare persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Build signed, minified release APK
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Build debug APK (signing key not configured)
        if: env.HAS_SIGNING != 'true'
        run: gradle assembleDebug --stacktrace

      - name: Select APK for publishing
        run: |
          mkdir -p app/build/outputs/apk/publish
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/publish/SafeBaiyun.apk
            echo "APK_TYPE=release" >> "$GITHUB_ENV"
          else
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/publish/SafeBaiyun.apk
            echo "APK_TYPE=debug" >> "$GITHUB_ENV"
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeBaiyun-${{ env.APK_TYPE }}-apk
          path: app/build/outputs/apk/publish/SafeBaiyun.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: app/build/outputs/apk/publish/SafeBaiyun.apk
          RELEASE_TAG: android-build-${{ github.run_number }}
        run: |
          if [ "$APK_TYPE" = "release" ]; then
            NOTES="Signed release APK with R8 code shrinking and resource shrinking."
          else
            NOTES="Debug APK. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets to enable stable release signing and upgrade installation."
          fi
          gh release create "$RELEASE_TAG" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SafeBaiyun Android build ${{ github.run_number }}" \
            --notes "$NOTES Commit: $GITHUB_SHA" \
            --prerelease
