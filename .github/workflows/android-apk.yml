name: Build and publish Android APK

on:
  push:
    branches:
      - fix/edit-dialog-ime-copy
      - feat/multi-config-bluetooth-import-export
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          validate-wrappers: false

      - name: Validate and prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secrets:$missing"
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/safebaiyun-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore validation failed. Check the Base64 content, keystore password and key alias."
            exit 1
          fi

          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "Release signing key validated."

      - name: Build signed, minified release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signature and report size
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          SIZE="$(wc -c < "$APK" | tr -d ' ')"
          HUMAN_SIZE="$(du -h "$APK" | cut -f1)"
          echo "Release APK size: $SIZE bytes ($HUMAN_SIZE)"
          {
            echo "### APK build"
            echo "- Variant: Release (signed)"
            echo "- Version: 1.2 (versionCode 3)"
            echo "- APK size: $SIZE bytes ($HUMAN_SIZE)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeBaiyun-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: app/build/outputs/apk/release/app-release.apk
          RELEASE_TAG: android-release-${{ github.run_number }}
        run: gh release create "$RELEASE_TAG" "$APK_PATH" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SafeBaiyun Android release ${{ github.run_number }}" --notes "Signed Release APK. R8 code shrinking and resource shrinking enabled. Version 1.2 (versionCode 3). Commit: $GITHUB_SHA" --prerelease
